apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: client:local
          imagePullPolicy: Never
          env:
            - name: INVENTORY_URL
              value: "http://inventory"
